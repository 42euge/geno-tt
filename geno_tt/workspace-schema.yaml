version: 1

tracks:
  - crit
  - explore
  - chore
  - side

layout:
  born: "{year}.q{quarter}"
  workspace: "code/{track}/{domain}/{workspace}.{born}"
  repository: "{repo}"

overlay:
  file: "{workspace}.code-workspace"
  tag_separator: "-"
  root:
    name: "{workspace_born}"
    path: "."
  repository:
    name: "{repo}{tag_suffix}"
    path: "{repository_path}"
  default_themes:
    - Dark Modern
    - Dark+
    - Dark (Visual Studio)

agent_context:
  file: "AGENTS.md"
  symlinks:
    - CLAUDE.md
  migrate_from:
    - CLAUDE.local.md
  managed_marker: "<!-- generated-by-tt-overlay -->"
  preserve_from: "## Local context"
  template: |
    # Workspace: {workspace_born}

    <!-- generated-by-tt-overlay -->

    Workspace under the **{track}** track, in the code-org scheme (`{scheme}`).

    ## Repos ({repo_count})

    {repos}

    ## Notes
    - This overlay is generated by `tt` — safe to reconcile with `tt workspaces check --fix`.
    - The workspace root is the first folder in the `.code-workspace`.
    - `tt inv` shows this workspace; whole-workspace worktrees live in `.wt/`.
